<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dankeseite</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            z-index: 1;
            background-color: rgba(214, 170, 219, 0.8); /* Falls das Video durchscheinen soll */
        }

        h1 {
            font-size: clamp(1.5rem, 5vw, 2.5rem); /* Responsive Schriftgröße */
            margin-bottom: 1rem;
        }

        p {
            font-size: clamp(1rem, 3vw, 1.5rem);
            margin-bottom: 2rem;
        }

        button {
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #1c5da1;
        }

        .showcase {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .video-container {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Skaliert das Video, um den Container zu füllen */
        }

        /* Optional: Overlay für bessere Textlesbarkeit */
     
           

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Vielen Dank für Ihre Nachricht!</h1>
        <p>Wir melden uns bei Ihnen.</p>
        <a href="../index.html"><button>Zurück zur Hauptseite</button></a>
    </div>
    <section class="showcase">
        <div class="video-container">
            <video src="/Video/mechanic2.mp4" autoplay muted loop></video>
        </div>
    </section>
</body>
</html>
